apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: soccer-backend:latest
          imagePullPolicy: Never
          command:
            - celery
          args:
            - -A
            - app.core.celery_app
            - worker
            - -B
            - --pool=solo
            - --loglevel=info
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://soccer:soccer_pass@postgres:5432/soccer_telemetry"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/1"
